name: Helm Integration Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Deploy to k3s & smoke-test
    runs-on: ubuntu-latest
    environment: main
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Map local.threadql.com to localhost
        run: echo "127.0.0.1 local.threadql.com" | sudo tee -a /etc/hosts

      - name: Install k3s
        run: |
          curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode=644" sh -
          echo "KUBECONFIG=/etc/rancher/k3s/k3s.yaml" >> "$GITHUB_ENV"

      - name: Wait for k3s node to be ready
        run: kubectl wait --for=condition=Ready node --all --timeout=120s

      - name: Wait for Traefik to be ready
        run: |
          echo "Waiting for Traefik deployment..."
          for i in $(seq 1 30); do
            if kubectl -n kube-system get deploy traefik >/dev/null 2>&1; then
              kubectl -n kube-system rollout status deploy/traefik --timeout=120s
              break
            fi
            echo "  attempt $i — traefik deployment not found yet"
            sleep 4
          done

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Add Helm repositories
        run: helm repo add haproxytech https://haproxytech.github.io/helm-charts

      - name: Build chart dependencies
        run: helm dependency build helm/threadql

      - name: Create Docker Hub registry secret
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-password=${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Deploy chart to k3s
        run: |
          helm install threadql helm/threadql \
            -f helm/threadql/ci-values.yaml \
            --wait \
            --timeout=300s

      - name: Show rollout status
        run: |
          kubectl get pods -o wide
          kubectl get ingress

      - name: Smoke-test /health endpoint
        run: |
          echo "Testing http://local.threadql.com/health ..."
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            --retry 10 --retry-delay 3 --retry-all-errors \
            --max-time 10 \
            http://local.threadql.com/health)
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "200" ]

          BODY=$(curl -sf --max-time 10 http://local.threadql.com/health)
          echo "Response body: $BODY"
          [ "$BODY" = "healthy" ]

      - name: Smoke-test / endpoint (Laravel)
        run: |
          echo "Testing http://local.threadql.com/ ..."
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --max-time 10 \
            http://local.threadql.com/)
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "200" ]

      # ---- Debug info on failure ----
      - name: Dump pod logs
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -o wide
          echo ""
          echo "=== Ingress ==="
          kubectl get ingress -o yaml
          echo ""
          echo "=== Events ==="
          kubectl get events --sort-by=.lastTimestamp
          echo ""
          for POD in $(kubectl get pods -o name); do
            echo "--- Logs: $POD ---"
            kubectl logs "$POD" --all-containers --tail=80 || true
            echo ""
          done
          echo "--- Describe pods ---"
          kubectl describe pods
