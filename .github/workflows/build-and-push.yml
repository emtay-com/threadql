name: Build and Push Docker Images

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push threadql
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: emtaycom/threadql:latest
          cache-from: type=gha,scope=threadql
          cache-to: type=gha,mode=max,scope=threadql

      - name: Build and push threadql-worker
        uses: docker/build-push-action@v6
        with:
          context: docker/worker
          file: docker/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: emtaycom/threadql-worker:latest
          cache-from: type=gha,scope=threadql-worker
          cache-to: type=gha,mode=max,scope=threadql-worker

      - name: Build and push threadql-ssh-tunnel
        uses: docker/build-push-action@v6
        with:
          context: ./docker/ssh-tunnel
          file: ./docker/ssh-tunnel/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: emtaycom/threadql-ssh-tunnel:latest
          cache-from: type=gha,scope=threadql-ssh-tunnel
          cache-to: type=gha,mode=max,scope=threadql-ssh-tunnel
