{{- if and (not .Values.envFrom.secretRef) (not .Values.envFrom.configMapRef) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "threadql.envSecretName" . }}
  labels:
    {{- include "threadql.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* Keys managed by the chart — skipped in the range loop below */}}
  {{- $managed := list "DB_HOST" "REDIS_HOST" "MCP_APP_URL" "SSH_TUNNEL_MANAGER_URL" }}
  {{- if and .Values.mysql.enabled .Values.mysql.rootPassword }}
  {{- $managed = append $managed "DB_PASSWORD" }}
  {{- end }}
  {{- /* Render user-provided env vars, skipping auto-managed keys */}}
  {{- range $key, $value := .Values.env }}
  {{- if not (has $key $managed) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- /* Auto-resolved internal service URLs */}}
  DB_HOST: {{ include "threadql.mysqlHost" . | quote }}
  REDIS_HOST: {{ include "threadql.redisHost" . | quote }}
  MCP_APP_URL: {{ include "threadql.mcpUrl" . | quote }}
  {{- if .Values.sshTunnel.enabled }}
  SSH_TUNNEL_MANAGER_URL: {{ include "threadql.sshTunnelUrl" . | quote }}
  {{- end }}
  {{- if and .Values.mysql.enabled .Values.mysql.rootPassword }}
  DB_PASSWORD: {{ .Values.mysql.rootPassword | quote }}
  {{- end }}
{{- end }}
