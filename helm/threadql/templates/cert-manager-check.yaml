{{- if .Values.certManager.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "threadql.fullname" . }}-certmgr-check
  labels:
    {{- include "threadql.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "threadql.fullname" . }}-certmgr-check
  labels:
    {{- include "threadql.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "threadql.fullname" . }}-certmgr-check
subjects:
  - kind: ServiceAccount
    name: {{ include "threadql.fullname" . }}-certmgr-check
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "threadql.fullname" . }}-certmgr-check
  labels:
    {{- include "threadql.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["clusterissuers.cert-manager.io"]
    verbs: ["get"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "threadql.fullname" . }}-certmgr-check
  labels:
    {{- include "threadql.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "threadql.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "threadql.fullname" . }}-certmgr-check
      restartPolicy: Never
      containers:
        - name: check
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              if kubectl get crd clusterissuers.cert-manager.io >/dev/null 2>&1; then
                echo "cert-manager CRDs found — OK"
              else
                echo "ERROR: cert-manager is not installed."
                echo "certManager.enabled is true but the ClusterIssuer CRD was not found."
                echo ""
                echo "Install cert-manager first:"
                echo "  kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml"
                echo "  kubectl wait --for=condition=Available deploy --all -n cert-manager --timeout=120s"
                exit 1
              fi
{{- end }}
