[program:normal-worker]
command=/usr/local/bin/php /var/www/app/artisan queue:work --tries=3 --queue=default
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=3
stdout_logfile=/var/log/worker.log

[program:long-worker]
command=/usr/local/bin/php /var/www/app/artisan queue:work --queue=long_queue --sleep=5  --tries=1 --timeout=1440
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=3
stdout_logfile=/var/log/worker.log
