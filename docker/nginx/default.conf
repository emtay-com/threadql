# Minimal, single-server config for Laravel + php-fpm

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Laravel public dir
    root /var/www/app/public;
    index index.php index.html;

    # Security headers (optional)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Laravel front controller
    # MCP routes (/mcp) are handled by Laravel's routing system via routes/ai.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling
    location ~ \.php$ {
        # ensure the file exists (optional)
        try_files $uri =404;

        # Do not forward PHP implementation details to clients.
        fastcgi_hide_header X-Powered-By;

        include fastcgi_params;

        # very important: point SCRIPT_FILENAME at docroot + script
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # forward proxy headers so Laravel detects HTTPS behind reverse proxy
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;

        # talk to php-fpm in the *php service container*, not localhost
        fastcgi_pass threadql:9000;

        # timeouts (tune as needed)
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 60;
    }

    # deny hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # basic static cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|ttf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # simple health
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
